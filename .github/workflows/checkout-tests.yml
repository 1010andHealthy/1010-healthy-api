name: Checkout regression tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run checkout regression suite (mocked Stripe / Maps)
        run: npm test
      - name: Verify live legacy backend Stripe compatibility without charging
        if: github.event_name == 'pull_request'
        run: node test/legacy-backend-preflight.mjs
      # Dispatch manually from this feature branch after configuring the repo's
      # STRIPE_TEST_SECRET_KEY secret. Never expose secrets to PR-triggered code.
      - name: Real Stripe test-mode checkout sessions (unpaid, manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        run: node test/stripe-testmode-smoke.mjs
