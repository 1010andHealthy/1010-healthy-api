name: Post-publication browser verification (unpaid)
on:
  push:
    branches: ['qa/nov2026-live-storefront-check']
    paths:
      - 'test/live-storefront-browser.mjs'
      - '.github/workflows/postpublish-storefront.yml'
permissions:
  contents: read
jobs:
  live-storefront:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright browser tooling
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run actual browser through storefront to unpaid Stripe Checkout
        run: node test/live-storefront-browser.mjs
